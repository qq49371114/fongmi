# ✨✨✨ 婉儿的“KitKat 终极修复”工作流 v2.0 ✨✨✨

name: KitKat Build - 婉儿终极修复版

on:
  push:
    branches: [ kitkat ] # 只在 kitkat 分支 push 时触发
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 步骤 1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤 2: 设置 Java 环境为 JDK 11 (AGP 插件需要)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      # 步骤 3: ✨【核心修复】✨ 安装并指定 Python 3.8 环境
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.8' # 明确指定一个和 Chaquopy 兼容性最好的版本
          cache: 'pip'

      # 步骤 4: 创建本地配置文件 (解决 SDK 路径问题)
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 步骤 5: 授权 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 步骤 6: 执行编译 (只编译 leanbackRelease 版本，更专注、更快)
      - name: Build with Gradle
        run: ./gradlew :app:assembleLeanbackRelease --stacktrace

      # 步骤 7: 上传编译好的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-kitkat-apk
          path: app/build/outputs/apk/leanback/release/*.apk
