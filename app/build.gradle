plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    buildToolsVersion "34.0.0"

    // 1. 核心：把三个维度，降成一个！
    flavorDimensions = ["default"]

    defaultConfig {
        applicationId "com.fongmi.android.tv"
        minSdk 19
        targetSdk 34
        versionCode 241
        versionName "2.4.1-kitkat-revived"
        multiDexEnabled true
        ndk { abiFilters "armeabi-v7a" } // 只保留一个核心架构
    }

    // 2. 核心：只保留 leanback，其他的全不要！
    productFlavors {
        leanback {
            dimension "default"
        }
    }

    buildFeatures { viewBinding true }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions { exclude 'META-INF/beans.xml' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 简化 APK 文件名输出逻辑
    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "fongmi-kitkat-leanback.apk"
        }
    }

    // ✨ 保留哥哥的强制版本解析策略
    configurations.configureEach {
        resolutionStrategy {
            force 'com.squareup.okhttp3:okhttp:' + okhttpVersion
            force 'com.squareup.okio:okio:' + okioVersion
            force 'androidx.media:media:1.6.0'
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
    }
}

dependencies {
    // 1. 本地模块依赖 (全部保留)
    implementation project(':hook')
    implementation project(':tvbus')
    implementation project(':catvod')
    implementation project(':pyramid')
    implementation project(':quickjs')
    implementation project(':thunder')
    implementation project(':jianpian')
    implementation project(':forcetech')
    implementation project(':ijkplayer')

    // 2. ✨✨✨ 核心：把所有私有的 .aar 依赖全部注释掉！ ✨✨✨
    // implementation(ext: 'aar', name: 'lib-common-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-container-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-database-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-datasource-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-datasource-okhttp-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-datasource-rtmp-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-decoder-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-decoder-av1-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-decoder-ffmpeg-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-exoplayer-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-exoplayer-dash-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-exoplayer-hls-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-exoplayer-rtsp-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-exoplayer-smoothstreaming-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-extractor-release', group: 'fongmi', version: 'release')
    // implementation(ext: 'aar', name: 'lib-ui-release', group: 'fongmi', version: 'release')
     implementation(ext: 'aar', name: 'dlna-core', group: 'fongmi', version: 'release')
     implementation(ext: 'aar', name: 'dlna-dmr', group: 'fongmi', version: 'release')
     implementation(ext: 'aar', name: 'dlna-dmc', group: 'fongmi', version: 'release')

    // 3. ✨✨✨ 核心：注入“公版”的 ExoPlayer 引擎 ✨✨✨
    def exoplayer_version = '2.14.2' // 这是一个能在 KitKat 上稳定运行的版本
    implementation "com.google.android.exoplayer:exoplayer-core:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-ui:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-dash:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-hls:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-rtmp:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-smoothstreaming:$exoplayer_version"

    // 4. AndroidX 核心库 (使用兼容老系统的稳定版本)
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.3.1'
    implementation 'androidx.room:room-runtime:2.4.3'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.media:media:1.6.0'

    // 5. 其他所有第三方库 (100% 还原，一个都不少！)
    implementation 'cat.ereza:customactivityoncrash:2.4.0'
    implementation 'com.github.bassaer:materialdesigncolors:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.12.0' // 降级以提高兼容性
    implementation 'com.github.bumptech.glide:annotations:4.12.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.12.0'
    implementation 'com.github.ctiao:DanmakuFlameMaster:0.9.25'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    implementation 'com.github.jahirfiquitiva:TextDrawable:1.0.3'
    implementation('com.github.teamnewpipe:NewPipeExtractor:v0.23.1') { exclude group: 'org.jsoup', module: 'jsoup' }
    implementation 'com.github.thegrizzlylabs:sardine-android:0.9'
    implementation 'com.google.net.cronet:cronet-okhttp:0.1.0'
    implementation 'com.google.zxing:core:3.3.0'
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'
    implementation 'com.hierynomus:smbj:0.11.5'
    implementation 'com.tencent.tbs:tbssdk:44286'
    implementation 'com.github.YarikSOffice:lingver:1.3.0'
    implementation 'me.jessyan:autosize:1.2.1'
    implementation 'org.eclipse.jetty:jetty-client:8.1.21.v20160908'
    implementation 'org.eclipse.jetty:jetty-server:8.1.21.v20160908'
    implementation 'org.eclipse.jetty:jetty-servlet:8.1.21.v20160908'
    implementation 'org.fourthline.cling:cling-core:2.1.1'
    implementation 'org.fourthline.cling:cling-support:2.1.1'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation('org.simpleframework:simple-xml:2.7.1') { exclude group: 'stax', module: 'stax-api' exclude group: 'xpp3', module: 'xpp3' }
    
    annotationProcessor 'androidx.room:room-compiler:2.4.3'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
}
